<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سایت‌ساز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--fg:#1c1c1e;--mu:#6b7280;--ln:#e2e4e9;--ac:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121316;--cd:#1c1e23;--fg:#f1f1f3;--mu:#a1a1aa;--ln:#2e3138;--ac:#2dd4bf}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;padding:16px;min-height:100vh}
#panel,#pv{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:20px}
#pv{position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column;gap:10px;padding:12px}
#pv iframe{flex:1;width:100%;max-width:100%;margin:auto;border:1px solid var(--ln);border-radius:10px;background:#fff}
#bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}#bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
h2{margin:6px 0 4px}h3{margin:18px 0 8px;font-size:1rem}small,.hint{color:var(--mu)}
label{display:block;margin-top:12px;font-size:.9rem}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:90px}input[type=color]{height:44px;padding:3px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--cd);color:var(--fg);border-radius:10px;padding:10px 18px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.ch{flex:1;min-width:90px}.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sw{flex:0 0 40px;min-width:40px;height:40px;padding:0;border-radius:50%}.sw.on{outline:3px solid var(--fg);outline-offset:2px}
.foot{display:flex;justify-content:space-between;margin-top:26px}.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.ord{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}.ord input{flex:1;min-width:0}.ord span{white-space:nowrap}.th{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}.box{border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:14px}
@media(max-width:820px){main{grid-template-columns:1fr}#pv{position:static;height:75vh}}
</style></head><body>
<main>
<section id="panel"><div id="bar"><i></i></div><small id="cnt"></small><h2 id="ttl"></h2><p class="hint" id="hnt"></p><div id="body"></div>
<div class="foot"><button id="bk">قبلی</button><button id="nx" class="pri">بعدی</button></div></section>
<section id="pv"><div class="row"><button class="ch" data-w="100%">دسکتاپ</button><button class="ch" data-w="375px">موبایل</button></div>
<iframe title="پیش‌نمایش سایت" sandbox="allow-scripts"></iframe></section>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NA=()=>({img:'',t:'',d:'',bt:'',link:'',mode:'inline',side:'left',delay:2});
const NI=t=>({t,d:'توضیح کوتاه',p:'',imgs:[],pos:'top',bon:false,bt:'اطلاعات بیشتر',bl:''});
const C={name:'سایت من',tag:'یک جمله درباره‌ی ما',color:'#0f766e',theme:'light',font:'tahoma',radius:'soft',
nav:{on:true,style:'bar',dark:true},
hero:{on:true,layout:'center',img:'',link:'#contact',title:'به سایت ما خوش آمدید',text:'اینجا توضیح کوتاهی می‌نویسید که بازدیدکننده بفهمد شما چه کار می‌کنید.',btn:'تماس با ما'},
about:{on:true,title:'درباره ما',text:'از خودتان، تیم یا کسب‌وکارتان بنویسید.'},
services:{on:true,title:'خدمات ما',cols:3,list:[NI('مورد اول'),NI('مورد دوم'),NI('مورد سوم')]},
contact:{on:true,title:'تماس با ما',email:'',phone:''},
gallery:{on:false,title:'گالری',cols:3,imgs:[]},
ads:{on:false,list:[]},
footer:{on:true,address:'',instagram:'',telegram:'',copy:'همه حقوق محفوظ است.'},
order:['hero','ads','about','services','gallery','contact']};
const L={hero:'بخش اصلی',about:'درباره ما',services:'خدمات و محصولات',gallery:'گالری',ads:'پنل تبلیغات',contact:'تماس'};
const get=p=>p.split('.').reduce((o,k)=>o[k],C),set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],C)[l]=v};
const T=(p,l,m)=>`<label>${l}${m?`<textarea data-k="${p}">${esc(get(p))}</textarea>`:`<input data-k="${p}" value="${esc(get(p))}">`}</label>`;
const ch=(p,o)=>`<div class="row">${o.map(([v,l])=>`<button class="ch ${String(get(p))===String(v)?'on':''}" data-k="${p}" data-v="${v}">${l}</button>`).join('')}</div>`;
const yn=(p,q)=>`<h3>${q}</h3>`+ch(p,[[true,'بله'],[false,'نه']]);
const heroImg=()=>`<h3>عکس</h3>${C.hero.img?`<div class="ord"><img class="th" src="${C.hero.img}" alt=""><button data-rm="h">حذف عکس</button></div>`:''}<label>${C.hero.img?'تغییر عکس':'انتخاب عکس از دستگاه'}<input type="file" accept="image/*" data-up="h"></label><p class="hint">اگر عکسی انتخاب نکنید، در حالت «متن و تصویر» یک طرح رنگی نمایش داده می‌شود.</p>`;
const adUI=(a,i)=>{const k='ads.list.'+i;return`<div class="box"><div class="ord"><b>تبلیغ ${i+1}</b><button data-ar="${i}">✕</button></div><h3>محل نمایش</h3>${ch(k+'.mode',[['inline','داخل صفحه'],['corner','گوشه صفحه (قابل بستن)'],['popup','وسط صفحه (پاپ‌آپ)']])}${a.mode==='corner'?`<h3>کدام گوشه؟</h3>${ch(k+'.side',[['left','چپ'],['right','راست']])}`:''}${a.mode!=='inline'?T(k+'.delay','نمایش بعد از چند ثانیه؟'):''}${a.img?`<img class="th" style="width:100%;height:auto;max-height:120px" src="${a.img}" alt="">`:''}<label>${a.img?'تغییر عکس بنر':'انتخاب عکس بنر'}<input type="file" accept="image/*" data-up="a${i}"></label>${T(k+'.t','عنوان تبلیغ (اختیاری)')}${T(k+'.d','متن تبلیغ (اختیاری)',1)}${T(k+'.bt','متن دکمه (اگر دکمه می‌خواهید)')}${T(k+'.link','لینک (با کلیک روی عکس یا دکمه باز می‌شود)')}</div>`};
const itemUI=(m,i)=>{const k='services.list.'+i;return`<div class="box"><div class="ord"><b>مورد ${i+1}</b><span><button data-im="${i},-1">▲</button> <button data-im="${i},1">▼</button> <button data-ir="${i}">✕</button></span></div>${T(k+'.t','عنوان')}${T(k+'.p','قیمت (اختیاری)')}${T(k+'.d','توضیح',1)}<h3>جای عکس</h3>${ch(k+'.pos',[['top','بالا'],['side','کنار'],['bottom','پایین']])}${m.imgs.map((d,j)=>`<div class="ord"><img class="th" src="${d}" alt=""><button data-ix="${i},${j}">حذف عکس</button></div>`).join('')}<label>افزودن عکس (می‌توانید چند عکس انتخاب کنید)<input type="file" accept="image/*" multiple data-up="i${i}"></label><h3>دکمه می‌خواهید؟</h3>${ch(k+'.bon',[[true,'بله'],[false,'نه']])}${m.bon?T(k+'.bt','متن دکمه')+T(k+'.bl','لینک دکمه (مثلاً https://...)'):''}</div>`};
const sw=['#0f766e','#2563eb','#7c3aed','#db2777','#ea580c','#16a34a','#111827'];
const steps=[
['نام سایت','سایتتان چه اسمی دارد؟',()=>T('name','نام سایت')+T('tag','یک جمله درباره‌ی سایت')],
['ظاهر سایت','رنگ و حال‌وهوای سایت را انتخاب کنید.',()=>`<h3>رنگ اصلی</h3><div class="row">${sw.map(c=>`<button class="ch sw ${C.color===c?'on':''}" style="background:${c}" aria-label="${c}" data-k="color" data-v="${c}"></button>`).join('')}</div>${T('color','رنگ دلخواه').replace('<input','<input type="color"')}<h3>حالت</h3>${ch('theme',[['light','روشن'],['dark','تیره']])}<h3>فونت</h3>${ch('font',[['tahoma','ساده'],['system','مدرن'],['serif','رسمی']])}<h3>گوشه‌ها</h3>${ch('radius',[['sharp','تیز'],['soft','نرم'],['round','گرد']])}`],
['منوی بالا','',()=>yn('nav.on','منوی بالای صفحه می‌خواهید؟')+(C.nav.on?`<h3>شکل منو</h3>${ch('nav.style',[['bar','نوار افقی'],['drawer','کشوی کناری']])}${yn('nav.dark','دکمه‌ی حالت تیره/روشن باشد؟')}`:'')],
['بخش اصلی','اولین چیزی که بازدیدکننده می‌بیند.',()=>yn('hero.on','بخش اصلی باشد؟')+(C.hero.on?`<h3>چیدمان</h3>${ch('hero.layout',[['center','وسط‌چین'],['side','متن و تصویر']])}${heroImg()}${T('hero.title','تیتر')}${T('hero.text','توضیح',1)}${T('hero.btn','متن دکمه')}${T('hero.link','لینک دکمه (آدرس سایت، یا #contact برای رفتن به بخش تماس)')}`:'')],
['پنل تبلیغات','بنرهای تصویری که با کلیک روی آن‌ها یک لینک باز می‌شود.',()=>yn('ads.on','پنل تبلیغات می‌خواهید؟')+(C.ads.on?C.ads.list.map(adUI).join('')+`<p><button class="pri" data-aa="1">+ افزودن تبلیغ</button></p>`:'')],
['درباره ما','',()=>yn('about.on','بخش «درباره ما» باشد؟')+(C.about.on?T('about.title','عنوان بخش')+T('about.text','متن',1):'')],
['خدمات و محصولات','هر مورد می‌تواند عنوان، قیمت، توضیح و عکس داشته باشد.',()=>yn('services.on','بخش خدمات یا محصولات باشد؟')+(C.services.on?T('services.title','عنوان بخش')+`<h3>تعداد ستون</h3>${ch('services.cols',[[1,'۱'],[2,'۲'],[3,'۳']])}${C.services.list.map(itemUI).join('')}<p><button class="pri" data-add="1">+ افزودن مورد</button></p>`:'')],
['گالری عکس','هر تعداد عکس که می‌خواهید اضافه کنید.',()=>yn('gallery.on','گالری عکس باشد؟')+(C.gallery.on?T('gallery.title','عنوان بخش')+`<h3>تعداد ستون</h3>${ch('gallery.cols',[[2,'۲'],[3,'۳'],[4,'۴']])}<label>افزودن عکس (چند عکس را می‌توانید با هم انتخاب کنید)<input type="file" accept="image/*" multiple data-up="g"></label>${C.gallery.imgs.map((m,i)=>`<div class="ord"><img class="th" src="${m.d}" alt=""><input data-k="gallery.imgs.${i}.a" value="${esc(m.a)}" placeholder="توضیح عکس (اختیاری)"><span><button data-gm="${i},-1">▲</button> <button data-gm="${i},1">▼</button> <button data-rm="g.${i}">✕</button></span></div>`).join('')}`:'')],
['تماس','',()=>yn('contact.on','فرم تماس باشد؟')+(C.contact.on?T('contact.title','عنوان بخش')+T('contact.email','ایمیل (پیام‌ها به این آدرس می‌روند)')+T('contact.phone','تلفن'):'')],
['پایین صفحه','',()=>yn('footer.on','فوتر باشد؟')+(C.footer.on?T('footer.address','آدرس')+T('footer.instagram','آیدی اینستاگرام')+T('footer.telegram','آیدی تلگرام')+T('footer.copy','متن کپی‌رایت'):'')],
['ترتیب و دریافت','ترتیب بخش‌ها را تنظیم کنید و سایت را دانلود کنید.',()=>`<h3>ترتیب بخش‌ها</h3>${C.order.map((k,i)=>`<div class="ord"><span>${L[k]}</span><span><button data-mv="${i},-1">▲</button> <button data-mv="${i},1">▼</button></span></div>`).join('')}<h3>دانلود</h3><button class="pri" id="ex">دانلود سایت (ZIP)</button> <small id="st"></small>`]];
let s=0;
function show(){const [t,h,f]=steps[s];$('#cnt').textContent=`مرحله ${s+1} از ${steps.length}`;$('#bar i').style.width=(s+1)/steps.length*100+'%';$('#ttl').textContent=t;$('#hnt').textContent=h;$('#body').innerHTML=f();$('#bk').style.visibility=s?'visible':'hidden';$('#nx').style.visibility=s<steps.length-1?'visible':'hidden'}
const lk=u=>{u=(u||'#').trim()||'#';if(!/^(#|\/|mailto:|tel:|[a-z]+:\/\/)/i.test(u))u='https://'+u;return`href="${esc(u)}"${/^https?:/.test(u)?' target="_blank" rel="noopener"':''}`};
const fm=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\d{4,}/g,n=>n.replace(/\B(?=(\d{3})+(?!\d))/g,','));
const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)};
const lt=h=>{if(lum(h)>.25)return h;const n=parseInt(h.slice(1),16),m=v=>Math.round(v+(255-v)*.6);return'#'+[n>>16,n>>8&255,n&255].map(m).map(v=>v.toString(16).padStart(2,'0')).join('')};
function parts(exp){const o=C,r={sharp:'0',soft:'10px',round:'24px'}[o.radius],F={tahoma:'Tahoma,Arial,sans-serif',system:'system-ui,"Segoe UI",Arial,sans-serif',serif:'"Times New Roman",Georgia,serif'}[o.font];
const files=[],src=d=>{if(!exp)return d;const n='images/photo-'+(files.length+1)+'.jpg';files.push([n,d]);return n};
const adB=a=>{const im=a.img?`<img src="${src(a.img)}" alt="${esc(a.t)}">`:'';return(a.link&&im?`<a ${lk(a.link)}>${im}</a>`:im)+(a.t?`<h3>${esc(a.t)}</h3>`:'')+(a.d?`<p>${esc(a.d)}</p>`:'')+(a.bt?`<a class="btn" ${lk(a.link)}>${esc(a.bt)}</a>`:'')};
const on=o.order.filter(k=>o[k].on),links=on.filter(k=>k!=='hero'&&k!=='ads').map(k=>`<a href="#${k}">${esc(o[k].title)}</a>`).join(''),dr=o.nav.on&&o.nav.style==='drawer',dk=o.nav.on&&o.nav.dark;
const sec={
hero:()=>`<section id="hero" class="hero ${o.hero.layout}"><div><h1>${esc(o.hero.title)}</h1><p>${esc(o.hero.text)}</p><a class="btn" ${lk(o.hero.link)}>${esc(o.hero.btn)}</a></div>${o.hero.img?`<!-- عکس بخش اصلی: برای عوض‌کردنش، فایل عکس در پوشه images را با عکس دیگری با همین اسم جایگزین کنید -->\n<img class="pic" src="${src(o.hero.img)}" alt="${esc(o.hero.title)}">`:o.hero.layout==='side'?'<div class="art"></div>':''}</section>`,
about:()=>`<section id="about"><h2>${esc(o.about.title)}</h2><p>${esc(o.about.text)}</p></section>`,
services:()=>`<section id="services"><h2>${esc(o.services.title)}</h2>\n<!-- عکس‌های این بخش در پوشه images هستند؛ برای جایگزینی، عکس جدید را با همان اسم بگذارید -->\n<div class="grid" style="--n:${+o.services.cols}">${o.services.list.map(m=>`<article class="item ${m.pos}"><div class="tx"><h3>${esc(m.t)}</h3>${m.d?`<p>${esc(m.d)}</p>`:''}${m.p?`<strong class="price">${esc(fm(m.p))}</strong>`:''}${m.bon?`<p><a class="btn" ${lk(m.bl)}>${esc(m.bt)}</a></p>`:''}</div>${m.imgs.length?`<div class="pics">${m.imgs.map(d=>`<img src="${src(d)}" alt="${esc(m.t)}" loading="lazy">`).join('')}</div>`:''}</article>`).join('')}</div></section>`,
contact:()=>`<section id="contact"><h2>${esc(o.contact.title)}</h2>${o.contact.phone?`<p>تلفن: <span dir="ltr">${esc(o.contact.phone)}</span></p>`:''}<form action="mailto:${esc(o.contact.email)}" method="post" enctype="text/plain"><input name="name" placeholder="نام" aria-label="نام"><input name="email" type="email" placeholder="ایمیل" aria-label="ایمیل"><textarea name="message" placeholder="پیام" aria-label="پیام"></textarea><button class="btn" type="submit">ارسال</button></form></section>`,
gallery:()=>`<section id="gallery"><h2>${esc(o.gallery.title)}</h2>\n<!-- گالری: عکس‌ها در پوشه images هستند؛ برای جایگزینی، عکس جدید را با همان اسم بگذارید -->\n<div class="gal" style="--n:${+o.gallery.cols}">${o.gallery.imgs.map(m=>`<img src="${src(m.d)}" alt="${esc(m.a)}" loading="lazy">`).join('')}</div></section>`,
ads:()=>{const I=o.ads.list.filter(a=>a.mode==='inline');return I.length?`<section id="ads"><!-- تبلیغات داخل صفحه: عکس‌ها در پوشه images هستند؛ برای جایگزینی، عکس جدید را با همان اسم بگذارید -->${I.map(a=>`<div class="ad">${adB(a)}</div>`).join('')}</section>`:''}};
const f=o.footer,ft=f.on?`<footer>${f.address?`<p>${esc(f.address)}</p>`:''}<p>${f.instagram?`<a href="https://instagram.com/${esc(f.instagram)}">اینستاگرام</a> `:''}${f.telegram?`<a href="https://t.me/${esc(f.telegram)}">تلگرام</a>`:''}</p><p>${esc(f.copy)}</p></footer>`:'';
const fl=o.ads.on?o.ads.list.filter(a=>a.mode!=='inline').map(a=>`<div class="fad ${a.mode} ${a.side}" hidden data-delay="${exp?+a.delay||0:0}"><div class="box"><button class="x" aria-label="بستن">×</button>${adB(a)}</div></div>`).join(''):'';
const nav=o.nav.on?`<header class="nav ${dr?'drw':''}"><a class="brand" href="#">${esc(o.name)}</a>${dr?'':`<nav class="links">${links}</nav>`}<div class="tools">${dk?'<button id="theme" aria-label="تغییر حالت">◐</button>':''}<button id="menu" aria-label="منو">☰</button></div></header><aside id="drawer"><nav>${links}</nav></aside>`:'';
const css=`/* رنگ و ظاهر کل سایت از این چند متغیر کنترل می‌شود */
:root{--c:${o.color};--ct:${o.color};--bt:${lum(o.color)>.5?'#111':'#fff'};--bg:#fff;--fg:#1c1c1e;--mu:#6b7280;--cd:#f3f4f6;--r:${r}}
[data-theme=dark]{--ct:${lt(o.color)};--bg:#121316;--fg:#f1f1f3;--mu:#a1a1aa;--cd:#1e2025}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:${F};background:var(--bg);color:var(--fg);line-height:1.9}
.nav{display:flex;align-items:center;gap:16px;padding:12px 5%;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--cd);z-index:5}
.brand{font-weight:700;font-size:1.2rem;color:var(--ct);text-decoration:none;margin-inline-end:auto;white-space:nowrap}
.links{display:flex;gap:18px;flex-wrap:wrap}.links a,#drawer a{color:var(--fg);text-decoration:none}
.tools{display:flex;gap:8px}#menu{display:none}.nav.drw #menu{display:block}.tools button{width:40px;height:40px;border:0;border-radius:var(--r);background:var(--cd);color:var(--fg);font-size:18px;cursor:pointer}
#drawer{position:fixed;top:0;bottom:0;left:0;width:260px;padding:80px 24px;background:var(--bg);box-shadow:0 0 30px #0004;transform:translateX(-105%);transition:transform .25s;z-index:4}
.open #drawer{transform:none}#drawer a{display:block;padding:10px 0}
section{padding:64px 5%}h2{margin:0 0 16px}p{max-width:62ch}
.hero{display:grid;gap:32px;align-items:center;min-height:60vh}.hero.center{text-align:center;justify-items:center}.hero.side{grid-template-columns:1fr 1fr}
.hero h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1.4}
.btn{display:inline-block;padding:10px 26px;border:1px solid var(--ct);border-radius:var(--r);background:var(--c);color:var(--bt);font:inherit;text-decoration:none;cursor:pointer}
.art{aspect-ratio:4/3;border-radius:var(--r);background:linear-gradient(135deg,var(--c),var(--cd))}
.grid{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:16px}.item{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:var(--r);background:var(--cd)}.item.top{flex-direction:column-reverse}.item.side{flex-direction:row;align-items:center}.item.side .pics{width:42%}.tx{flex:1}.pics{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.item img{width:100%;max-height:280px;object-fit:cover;border-radius:var(--r)}.item h3{margin:0;color:var(--ct)}.item p{margin:6px 0}.price{color:var(--ct);font-size:1.1rem}
form{display:grid;gap:10px;max-width:480px}input,textarea{font:inherit;padding:10px;border:1px solid var(--mu);border-radius:var(--r);background:var(--bg);color:var(--fg)}
footer{padding:32px 5%;background:var(--cd);color:var(--mu)}footer a{color:var(--ct)}
#ads{display:grid;gap:12px;padding:16px 5%}.ad{padding:16px;border-radius:var(--r);background:var(--cd)}.fad{position:fixed;z-index:9}.fad[hidden]{display:none}.fad .box{position:relative;padding:36px 14px 14px;background:var(--bg);color:var(--fg);border:1px solid var(--cd);border-radius:var(--r);box-shadow:0 8px 30px #0005}.fad.corner{bottom:16px;width:min(300px,calc(100vw - 32px))}.fad.corner.left{left:16px}.fad.corner.right{right:16px}.fad.popup{inset:0;display:grid;place-items:center;background:#0008}.fad.popup .box{width:min(420px,calc(100vw - 32px));max-height:90vh;overflow:auto}.fad img,.ad img{display:block;width:100%;border-radius:var(--r);margin-bottom:8px}.fad h3,.ad h3{margin:4px 0;color:var(--ct)}.fad p,.ad p{margin:4px 0 10px}.x{position:absolute;top:6px;left:6px;width:30px;height:30px;border:0;border-radius:50%;background:var(--cd);color:var(--fg);font-size:18px;cursor:pointer}.pic{width:100%;border-radius:var(--r);object-fit:cover}.hero.center .pic{max-width:720px}.gal{display:grid;gap:12px;grid-template-columns:repeat(var(--n,3),1fr)}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r)}\n@media(max-width:700px){.hero.side{grid-template-columns:1fr}.gal{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.item.side{flex-direction:column}.item.side .pics{width:100%}.links{display:none}#menu{display:block}section{padding:40px 5%}.hero{min-height:auto}}`;
