<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سایت‌ساز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--fg:#1c1c1e;--mu:#6b7280;--ln:#e2e4e9;--ac:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121316;--cd:#1c1e23;--fg:#f1f1f3;--mu:#a1a1aa;--ln:#2e3138;--ac:#2dd4bf}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;padding:16px;min-height:100vh}
#panel,#pv{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:20px}
#pv{position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column;gap:10px;padding:12px}
#pv iframe{flex:1;width:100%;max-width:100%;margin:auto;border:1px solid var(--ln);border-radius:10px;background:#fff}
#bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}#bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
h2{margin:6px 0 4px}h3{margin:18px 0 8px;font-size:1rem}small,.hint{color:var(--mu)}
label{display:block;margin-top:12px;font-size:.9rem}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:90px}input[type=color]{height:44px;padding:3px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--cd);color:var(--fg);border-radius:10px;padding:10px 18px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row+.row{margin-top:8px}#panel{display:flex;gap:14px;align-items:flex-start}#pc{flex:1;min-width:0}#rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px}#rail button{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:12px}#rail button:disabled{opacity:.35;cursor:default}#rail button.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}.ch{flex:1;min-width:90px}.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sw{flex:0 0 40px;min-width:40px;height:40px;padding:0;border-radius:50%}.sw.on{outline:3px solid var(--fg);outline-offset:2px}
.foot{display:flex;justify-content:space-between;margin-top:26px}.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.ord{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}.ord input{flex:1;min-width:0}.ord span{white-space:nowrap}.th{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}.box{border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:14px}
@media(max-width:820px){main{grid-template-columns:1fr}#pv{position:static;height:75vh}}
</style></head><body>
<main>
<section id="panel"><nav id="rail" aria-label="مراحل"></nav><div id="pc"><div id="bar"><i></i></div><small id="cnt"></small><h2 id="ttl"></h2><p class="hint" id="hnt"></p><div id="body"></div>
<div class="foot"><button id="bk">قبلی</button><button id="nx" class="pri">بعدی</button></div></div></section>
<section id="pv"><div class="row"><button class="ch" data-w="100%">دسکتاپ</button><button class="ch" data-w="375px">موبایل</button></div>
<iframe title="پیش‌نمایش سایت" sandbox="allow-scripts"></iframe></section>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NS=()=>({title:'دسته‌بندی‌ها',place:'full',side:'left',after:'hero',mv:true,dir:'rtl',spd:4,items:[{img:'',t:'مورد اول',link:''},{img:'',t:'مورد دوم',link:''},{img:'',t:'مورد سوم',link:''}]});
const NA=()=>({img:'',t:'',d:'',bt:'',link:'',mode:'inline',side:'left',delay:2});
const NI=t=>({t,d:'توضیح کوتاه',p:'',imgs:[],pos:'top',bon:false,bt:'اطلاعات بیشتر',bl:''});
const C={name:'سایت من',tag:'یک جمله درباره‌ی ما',color:'#0f766e',theme:'light',font:'tahoma',radius:'soft',
nav:{on:true,style:'bar',dark:true},
hero:{on:true,layout:'center',img:'',link:'#contact',fix:false,title:'به سایت ما خوش آمدید',text:'اینجا توضیح کوتاهی می‌نویسید که بازدیدکننده بفهمد شما چه کار می‌کنید.',btn:'تماس با ما'},
about:{on:true,title:'درباره ما',text:'از خودتان، تیم یا کسب‌وکارتان بنویسید.'},
services:{on:true,title:'خدمات ما',cols:3,list:[NI('مورد اول'),NI('مورد دوم'),NI('مورد سوم')]},
contact:{on:true,title:'تماس با ما',email:'',phone:''},
gallery:{on:false,title:'گالری',cols:3,imgs:[]},
ads:{on:false,list:[]},
sliders:[],
login:{on:false,title:'ورود به حساب',email:true,google:true,github:true,eurl:'',gurl:'',hurl:''},
footer:{on:true,address:'',instagram:'',telegram:'',copy:'همه حقوق محفوظ است.'},
order:['hero','ads','about','services','gallery','contact']};
const L={hero:'بخش اصلی',about:'درباره ما',services:'خدمات و محصولات',gallery:'گالری',ads:'پنل تبلیغات',contact:'تماس'};
const get=p=>p.split('.').reduce((o,k)=>o[k],C),set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],C)[l]=v};
const T=(p,l,m)=>`<label>${l}${m?`<textarea data-k="${p}">${esc(get(p))}</textarea>`:`<input data-k="${p}" value="${esc(get(p))}">`}</label>`;
const ch=(p,o)=>`<div class="row">${o.map(([v,l])=>`<button class="ch ${String(get(p))===String(v)?'on':''}" data-k="${p}" data-v="${v}">${l}</button>`).join('')}</div>`;
const yn=(p,q)=>`<h3>${q}</h3>`+ch(p,[[true,'بله'],[false,'نه']]);
const heroImg=()=>`<h3>عکس</h3>${C.hero.img?`<div class="ord"><img class="th" src="${C.hero.img}" alt=""><button data-rm="h">حذف عکس</button></div>`:''}<label>${C.hero.img?'تغییر عکس':'انتخاب عکس از دستگاه'}<input type="file" accept="image/*" data-up="h"></label><p class="hint">اگر عکسی انتخاب نکنید، در حالت «متن و تصویر» یک طرح رنگی نمایش داده می‌شود.</p>`;
const sUI=(s,i)=>{const k='sliders.'+i;return`<div class="box"><div class="ord"><b>اسلایدر ${i+1}</b><button data-sx="${i}">✕</button></div>${T(k+'.title','عنوان (اختیاری)')}<h3>محل قرارگیری</h3>${ch(k+'.place',[['full','بین بخش‌ها'],['side','کنار بدنه']])}${s.place==='side'?`<h3>کدام طرف؟</h3>${ch(k+'.side',[['left','چپ'],['right','راست']])}`:`<h3>بعد از کدام بخش؟</h3>${ch(k+'.after',Object.entries(L))}`}<h3>حرکت خودکار</h3>${ch(k+'.mv',[[true,'بله'],[false,'نه']])}${s.mv?`${ch(k+'.dir',[['rtl','از راست به چپ'],['ltr','از چپ به راست']])}<h3>سرعت</h3>${ch(k+'.spd',[[7,'آهسته'],[4,'متوسط'],[2.5,'سریع']])}`:''}<h3>آیتم‌ها</h3><label>افزودن چند عکس با هم (هر عکس یک آیتم می‌شود)<input type="file" accept="image/*" multiple data-up="m${i}"></label>${s.items.map((it,j)=>`<div class="ord"><img class="th" style="background:var(--ln)" src="${it.img||'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='}" alt=""><input data-k="${k}.items.${j}.t" value="${esc(it.t)}" placeholder="عنوان"><button data-tx="${i},${j}">✕</button></div><div class="ord"><input data-k="${k}.items.${j}.link" value="${esc(it.link)}" placeholder="لینک (اختیاری)"><input type="file" accept="image/*" aria-label="عکس آیتم" data-up="s${i}_${j}"></div>`).join('')}<p><button data-ti="${i}">+ افزودن آیتم</button></p></div>`};
const adUI=(a,i)=>{const k='ads.list.'+i;return`<div class="box"><div class="ord"><b>تبلیغ ${i+1}</b><button data-ar="${i}">✕</button></div><h3>محل نمایش</h3>${ch(k+'.mode',[['inline','داخل صفحه'],['corner','گوشه صفحه (قابل بستن)'],['popup','وسط صفحه (پاپ‌آپ)']])}${a.mode==='corner'?`<h3>کدام گوشه؟</h3>${ch(k+'.side',[['left','چپ'],['right','راست']])}`:''}${a.mode!=='inline'?T(k+'.delay','نمایش بعد از چند ثانیه؟'):''}${a.img?`<img class="th" style="width:100%;height:auto;max-height:120px" src="${a.img}" alt="">`:''}<label>${a.img?'تغییر عکس بنر':'انتخاب عکس بنر'}<input type="file" accept="image/*" data-up="a${i}"></label>${T(k+'.t','عنوان تبلیغ (اختیاری)')}${T(k+'.d','متن تبلیغ (اختیاری)',1)}${T(k+'.bt','متن دکمه (اگر دکمه می‌خواهید)')}${T(k+'.link','لینک (با کلیک روی عکس یا دکمه باز می‌شود)')}</div>`};
const itemUI=(m,i)=>{const k='services.list.'+i;return`<div class="box"><div class="ord"><b>مورد ${i+1}</b><span><button data-im="${i},-1">▲</button> <button data-im="${i},1">▼</button> <button data-ir="${i}">✕</button></span></div>${T(k+'.t','عنوان')}${T(k+'.p','قیمت (اختیاری)')}${T(k+'.d','توضیح',1)}<h3>جای عکس</h3>${ch(k+'.pos',[['top','بالا'],['side','کنار'],['bottom','پایین']])}${m.imgs.map((d,j)=>`<div class="ord"><img class="th" src="${d}" alt=""><button data-ix="${i},${j}">حذف عکس</button></div>`).join('')}<label>افزودن عکس (می‌توانید چند عکس انتخاب کنید)<input type="file" accept="image/*" multiple data-up="i${i}"></label><h3>دکمه می‌خواهید؟</h3>${ch(k+'.bon',[[true,'بله'],[false,'نه']])}${m.bon?T(k+'.bt','متن دکمه')+T(k+'.bl','لینک دکمه (مثلاً https://...)'):''}</div>`};
const sw=['#0f766e','#2563eb','#7c3aed','#db2777','#ea580c','#16a34a','#111827'];
const steps=[
['نام سایت','سایتتان چه اسمی دارد؟',()=>T('name','نام سایت')+T('tag','یک جمله درباره‌ی سایت')],
['ظاهر سایت','رنگ و حال‌وهوای سایت را انتخاب کنید.',()=>`<h3>رنگ اصلی</h3><div class="row">${sw.map(c=>`<button class="ch sw ${C.color===c?'on':''}" style="background:${c}" aria-label="${c}" data-k="color" data-v="${c}"></button>`).join('')}</div>${T('color','رنگ دلخواه').replace('<input','<input type="color"')}<h3>حالت</h3>${ch('theme',[['light','روشن'],['dark','تیره']])}<h3>فونت</h3>${ch('font',[['tahoma','ساده'],['system','مدرن'],['serif','رسمی']])}<h3>گوشه‌ها</h3>${ch('radius',[['sharp','تیز'],['soft','نرم'],['round','گرد']])}`],
['منوی بالا','',()=>yn('nav.on','منوی بالای صفحه می‌خواهید؟')+(C.nav.on?`<h3>شکل منو</h3>${ch('nav.style',[['bar','نوار افقی'],['drawer','کشوی کناری']])}${yn('nav.dark','دکمه‌ی حالت تیره/روشن باشد؟')}`:'')],
['بخش اصلی','اولین چیزی که بازدیدکننده می‌بیند.',()=>yn('hero.on','بخش اصلی باشد؟')+(C.hero.on?`<h3>چیدمان</h3>${ch('hero.layout',[['center','وسط‌چین'],['side','متن و تصویر'],['cover','پس‌زمینه تمام‌عرض']])}${C.hero.layout==='cover'?`<h3>موقع پایین رفتن صفحه</h3>${ch('hero.fix',[[false,'مثل بقیه بالا می‌رود'],[true,'ثابت می‌ماند و بقیه صفحه روی آن می‌لغزد']])}`:''}${heroImg()}${T('hero.title','تیتر')}${T('hero.text','توضیح',1)}${T('hero.btn','متن دکمه')}${T('hero.link','لینک دکمه (آدرس سایت، یا #contact برای رفتن به بخش تماس)')}`:'')],
['پنل تبلیغات','بنرهای تصویری که با کلیک روی آن‌ها یک لینک باز می‌شود.',()=>yn('ads.on','پنل تبلیغات می‌خواهید؟')+(C.ads.on?C.ads.list.map(adUI).join('')+`<p><button class="pri" data-aa="1">+ افزودن تبلیغ</button></p>`:'')],
['درباره ما','',()=>yn('about.on','بخش «درباره ما» باشد؟')+(C.about.on?T('about.title','عنوان بخش')+T('about.text','متن',1):'')],
['خدمات و محصولات','هر مورد می‌تواند عنوان، قیمت، توضیح و عکس داشته باشد.',()=>yn('services.on','بخش خدمات یا محصولات باشد؟')+(C.services.on?T('services.title','عنوان بخش')+`<h3>تعداد ستون</h3>${ch('services.cols',[[1,'۱'],[2,'۲'],[3,'۳']])}${C.services.list.map(itemUI).join('')}<p><button class="pri" data-add="1">+ افزودن مورد</button></p>`:'')],
['گالری عکس','هر تعداد عکس که می‌خواهید اضافه کنید.',()=>yn('gallery.on','گالری عکس باشد؟')+(C.gallery.on?T('gallery.title','عنوان بخش')+`<h3>تعداد ستون</h3>${ch('gallery.cols',[[2,'۲'],[3,'۳'],[4,'۴']])}<label>افزودن عکس (چند عکس را می‌توانید با هم انتخاب کنید)<input type="file" accept="image/*" multiple data-up="g"></label>${C.gallery.imgs.map((m,i)=>`<div class="ord"><img class="th" src="${m.d}" alt=""><input data-k="gallery.imgs.${i}.a" value="${esc(m.a)}" placeholder="توضیح عکس (اختیاری)"><span><button data-gm="${i},-1">▲</button> <button data-gm="${i},1">▼</button> <button data-rm="g.${i}">✕</button></span></div>`).join('')}`:'')],
['اسلایدر و دسته‌بندی','نوار تصویری متحرک با هر تعداد آیتم، در جاهای مختلف سایت.',()=>(C.sliders.length?C.sliders.map(sUI).join(''):'<p class="hint">هنوز اسلایدری اضافه نکرده‌اید. اگر نمی‌خواهید، از این مرحله رد شوید.</p>')+`<p><button class="pri" data-sa="1">+ افزودن اسلایدر</button></p>`],
['ورود به سایت','دکمهٔ «ورود» که یک پنجره باز می‌کند.',()=>yn('login.on','قابلیت ورود (لاگین) می‌خواهید؟')+(C.login.on?T('login.title','عنوان پنجره')+yn('login.email','ورود با ایمیل و رمز عبور؟')+(C.login.email?T('login.eurl','آدرس سرویس ورود (action فرم)'):'')+yn('login.google','ورود با گوگل؟')+(C.login.google?T('login.gurl','لینک ورود با گوگل'):'')+yn('login.github','ورود با گیت‌هاب؟')+(C.login.github?T('login.hurl','لینک ورود با گیت‌هاب'):'')+'<p class="hint">توجه: سایت‌ساز فقط ظاهر ورود را می‌سازد. برای اینکه ورود واقعاً کار کند، آدرس یک سرویس احراز هویت (مثل Firebase، Supabase یا Auth0) را اینجا بگذارید. تا آن موقع، دکمه‌ها پیام «هنوز وصل نشده» نشان می‌دهند.</p>':'')],
['تماس','',()=>yn('contact.on','فرم تماس باشد؟')+(C.contact.on?T('contact.title','عنوان بخش')+T('contact.email','ایمیل (پیام‌ها به این آدرس می‌روند)')+T('contact.phone','تلفن'):'')],
['پایین صفحه','',()=>yn('footer.on','فوتر باشد؟')+(C.footer.on?T('footer.address','آدرس')+T('footer.instagram','آیدی اینستاگرام')+T('footer.telegram','آیدی تلگرام')+T('footer.copy','متن کپی‌رایت'):'')],
['ترتیب و دریافت','ترتیب بخش‌ها را تنظیم کنید و سایت را دانلود کنید.',()=>`<h3>ترتیب بخش‌ها</h3>${C.order.map((k,i)=>`<div class="ord"><span>${L[k]}</span><span><button data-mv="${i},-1">▲</button> <button data-mv="${i},1">▼</button></span></div>`).join('')}<h3>دانلود</h3><button class="pri" id="ex">دانلود سایت (ZIP)</button> <small id="st"></small>`]];
const IC=['🏷️','🎨','🧭','🌄','📢','ℹ️','🛍️','🖼️','🎞️','🔐','✉️','🦶','⬇️'];
const svg=p=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const SP=['<path d="M3 4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.2"/>','<path d="M12 3a9 9 0 100 18c1.5 0 2-1 1.5-2.2-.5-1.3.3-2.3 1.6-2.3H17a4 4 0 004-4c0-5-4-9.5-9-9.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>','<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 14h6"/>','<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M3 17l5-5 4 4 3-3 6 6"/>','<path d="M3 11v3a1 1 0 001 1h2l7 4V6L6 10H4a1 1 0 00-1 1z"/><path d="M17 9a4 4 0 010 6"/>','<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>','<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/>','<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>','<rect x="6" y="5" width="12" height="14" rx="2"/><path d="M3 9v6M21 9v6"/>','<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>','<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>','<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15h18"/>','<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'];
let ro=0;const rc=()=>Math.max(3,Math.min(steps.length,Math.floor((innerHeight-150)/52)));
function rail(){const n=steps.length,cap=rc();if(s<ro)ro=s;if(s>=ro+cap)ro=s-cap+1;ro=Math.max(0,Math.min(ro,n-cap));
$('#rail').innerHTML=(cap<n?`<button data-ro="-1" aria-label="بالاتر" title="بالاتر" ${ro?'':'disabled'}>${svg('<path d="M6 15l6-6 6 6"/>')}</button>`:'')+steps.slice(ro,ro+cap).map((x,k)=>{const i=ro+k;return`<button class="${i===s?'on':''}" data-go="${i}" title="${x[0]}" aria-label="${x[0]}">${svg(SP[i]||'')}</button>`}).join('')+(cap<n?`<button data-ro="1" aria-label="پایین‌تر" title="پایین‌تر" ${ro+cap<n?'':'disabled'}>${svg('<path d="M6 9l6 6 6-6"/>')}</button>`:'')}

$('#panel').addEventListener('input',e=>{if(e.target.dataset.k){set(e.target.dataset.k,e.target.value);pv()}});

const README=`راهنمای سایت شما\n\n۱. برای دیدن سایت، فایل index.html را با دوبار کلیک باز کنید.\n۲. برای تغییر رنگ و ظاهر، بالای فایل css/style.css را ببینید (بخش :root).\n۳. عکس‌ها در پوشه images هستند. برای عوض‌کردن هر عکس، عکس جدید را با همان اسم و پسوند (.jpg) جایگزین کنید.\n۴. برای آنلاین کردن: پوشه را روی netlify.com/drop بکشید یا از GitHub Pages استفاده کنید.\n`;
async function exp(){const st=$('#st');let dl=null;try{dl=await claude.use('downloads')}catch(e){}

const p=parts(true),z=new JSZip();z.file('index.html',page(false,p));z.file('css/style.css',p.css);p.files.forEach(([n,d])=>z.file(n,d.split(',')[1],{base64:true}));if(p.js)z.file('js/main.js',p.js);z.file('README.txt',README);
try{const bl=await z.generateAsync({type:'blob'});if(dl)await dl.save({filename:'my-site.zip',data:bl});else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='my-site.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)}st.textContent='ذخیره شد.'}catch(e){st.textContent=e.code==='declined'?'ذخیره لغو شد.':'ذخیره نشد.'}}
show();pv();
