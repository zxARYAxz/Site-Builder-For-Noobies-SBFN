<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سایت‌ساز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Amiri:wght@400;700&family=Lalezar&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--fg:#1c1c1e;--mu:#6b7280;--ln:#e2e4e9;--ac:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121316;--cd:#1c1e23;--fg:#f1f1f3;--mu:#a1a1aa;--ln:#2e3138;--ac:#2dd4bf}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
main{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,1fr);gap:18px;padding:18px;min-height:100vh;align-items:start}
#panel,#pv{background:var(--cd);border:1px solid var(--ln);border-radius:18px;box-shadow:0 8px 30px #00000008}
#panel{display:grid;grid-template-columns:minmax(200px,230px) minmax(0,1fr);gap:18px;padding:16px;align-items:start;min-width:0}
#pc{min-width:0;padding:4px 4px 8px}
#pv{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:10px;padding:12px;min-width:0}
#pv iframe{flex:1;width:100%;max-width:100%;margin:auto;border:1px solid var(--ln);border-radius:12px;background:#fff;transition:max-width .2s ease}
#bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}#bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
h2{margin:6px 0 4px}h3{margin:18px 0 8px;font-size:1rem}small,.hint{color:var(--mu)}
label{display:block;margin-top:12px;font-size:.9rem}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:90px}input[type=color]{height:44px;padding:3px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--cd);color:var(--fg);border-radius:10px;padding:10px 18px;transition:background .15s,border-color .15s,transform .15s}
button:hover:not(:disabled){border-color:var(--ac)}button:active:not(:disabled){transform:scale(.985)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row+.row{margin-top:8px}
#rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:8px;min-width:0;padding:2px}
.srch{padding:2px 2px 8px}.srch input{padding:8px 12px;font-size:.85rem}
.nav-group{border:1px solid var(--ln);border-radius:13px;overflow:hidden;background:var(--bg)}
.group-toggle{width:100%;display:flex;align-items:center;gap:9px;padding:10px 11px;border:0;border-radius:0;background:transparent;text-align:right;font-size:.88rem;font-weight:700}
.group-toggle .group-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:var(--cd);color:var(--fg);flex:none}
.group-toggle .group-name{flex:1;min-width:0}.group-toggle .chev{color:var(--mu);font-size:.8rem;transition:transform .18s}
.nav-group.open .group-toggle{color:var(--ac)}.nav-group.open .chev{transform:rotate(180deg)}
.group-items{display:grid;gap:3px;padding:0 7px 7px}.group-items[hidden]{display:none}
.step-link{width:100%;display:flex;align-items:center;gap:9px;text-align:right;padding:8px 9px;border:1px solid transparent;border-radius:9px;background:transparent;font-size:.82rem;line-height:1.5}
.step-link .step-icon{width:23px;display:grid;place-items:center;flex:none;opacity:.85}.step-link.on{background:var(--ac);border-color:var(--ac);color:#fff}.step-link .step-num{margin-inline-start:auto;font-size:.7rem;opacity:.65}
.ch{flex:1;min-width:90px}.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sw{flex:0 0 40px;min-width:40px;height:40px;padding:0;border-radius:50%}.sw.on{outline:3px solid var(--fg);outline-offset:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:26px}.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.ur{display:flex;gap:4px}.ur button{padding:8px 12px;font-size:15px;min-width:38px}
.ord{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}.ord input{flex:1;min-width:0}.ord span{white-space:nowrap}.th{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}.box{border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:14px}
.group-icon svg,.step-icon svg,.chev svg{display:block}.step-icon,.chev{line-height:0}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0}
.tpl-grid button{padding:14px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:.82rem;border-radius:12px;background:var(--bg)}
.tpl-grid button svg{color:var(--ac)}
@media(max-width:1050px){main{grid-template-columns:minmax(0,1fr)}#pv{position:static;height:70vh;min-height:420px;grid-row:2}#panel{grid-row:1}}
@media(max-width:620px){main{padding:8px;gap:10px}#panel{grid-template-columns:1fr;padding:10px;gap:12px;border-radius:14px}#rail{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}#pc{padding:4px 2px 8px}#pv{height:62vh;min-height:360px;padding:8px;border-radius:14px}.group-toggle{padding:8px;font-size:.8rem}.group-toggle .group-icon{width:25px;height:25px}.step-link{font-size:.78rem;padding:7px}#cnt{display:block;margin-top:6px}.foot{margin-top:18px}.tpl-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<main>
<section id="panel">
  <nav id="rail" aria-label="مراحل">
    <div class="srch"><input id="srch" type="search" placeholder="جستجو در تنظیمات…" aria-label="جستجو"></div>
  </nav>
  <div id="pc"><div id="bar"><i></i></div><small id="cnt"></small><h2 id="ttl"></h2><p class="hint" id="hnt"></p><div id="body"></div>
  <div class="foot"><button id="bk">قبلی</button><span class="ur"><button id="un" title="واگرد (Ctrl+Z)">↶</button><button id="re" title="ازنو (Ctrl+Y)">↷</button></span><button id="nx" class="pri">بعدی</button></div></div>
</section>
<section id="pv"><div class="row"><button class="ch" data-w="100%">دسکتاپ</button><button class="ch" data-w="375px">موبایل</button></div>
<iframe title="پیش‌نمایش سایت" sandbox="allow-scripts allow-popups"></iframe></section>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NS=()=>({title:'دسته‌بندی‌ها',place:'full',side:'left',after:'hero',mv:true,dir:'rtl',spd:4,items:[{img:'',t:'مورد اول',link:''},{img:'',t:'مورد دوم',link:''},{img:'',t:'مورد سوم',link:''}]});
const NA=()=>({img:'',t:'',d:'',bt:'',link:'',mode:'inline',side:'left',delay:2});
const NI=t=>({t,d:'توضیح کوتاه',p:'',imgs:[],pos:'top',bon:false,bt:'اطلاعات بیشتر',bl:''});

const DEFAULT={

 nav:{on:true,style:'bar',dark:true},
 hero:{on:true,layout:'center',img:'',link:'#contact',fix:false,title:'به سایت ما خوش آمدید',text:'اینجا توضیح کوتاهی می‌نویسید که بازدیدکننده بفهمد شما چه کار می‌کنید.',btn:'تماس با ما'},
 about:{on:true,title:'درباره ما',text:'از خودتان، تیم یا کسب‌وکارتان بنویسید.'},
 services:{on:true,title:'خدمات ما',cols:3,list:[NI('مورد اول'),NI('مورد دوم'),NI('مورد سوم')]},
 contact:{on:true,title:'تماس با ما',email:'',phone:'',endpoint:''},
 gallery:{on:false,title:'گالری',cols:3,imgs:[]},
 ads:{on:false,list:[]},
 sliders:[],
 login:{on:false,title:'ورود به حساب',email:true,google:true,github:true,eurl:'',gurl:'',hurl:''},
 footer:{on:true,address:'',instagram:'',telegram:'',whatsapp:'',linkedin:'',twitter:'',youtube:'',email:'',copy:'همه حقوق محفوظ است.'},
 seo:{desc:'',keywords:'',og:'',favicon:''},
 extras:{wa:false,top:true,prog:false,anim:true},
 order:['hero','ads','about','services','gallery','contact']
};
let C=JSON.parse(JSON.stringify(DEFAULT));
const clone=o=>JSON.parse(JSON.stringify(o));
function dm(t,s){if(Array.isArray(s))return clone(s);if(!s||typeof s!=='object')return s;const r={...(t||{})};for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k]))r[k]=dm(t&&t[k]||{},s[k]);else if(Array.isArray(s[k]))r[k]=clone(s[k]);else r[k]=s[k]}return r}

/* ذخیره‌سازی خودکار */
const SK='site-builder-v1';
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(C))}catch(e){}};
let svT;const saveD=()=>{clearTimeout(svT);svT=setTimeout(save,300)};
const load=()=>{try{const d=localStorage.getItem(SK);if(d)C=dm(clone(DEFAULT),JSON.parse(d))}catch(e){}};

/* Undo / Redo */
const H={past:[],future:[]};
const snap=()=>{H.past.push(JSON.stringify(C));if(H.past.length>80)H.past.shift();H.future.length=0;updUR()};
const undo=()=>{if(!H.past.length)return;H.future.push(JSON.stringify(C));C=JSON.parse(H.past.pop());save();show();pv();updUR()};
const redo=()=>{if(!H.future.length)return;H.past.push(JSON.stringify(C));C=JSON.parse(H.future.pop());save();show();pv();updUR()};
const updUR=()=>{const a=$('#un'),b=$('#re');if(a)a.disabled=!H.past.length;if(b)b.disabled=!H.future.length};

/* قالب‌های آماده */
const TEMPLATES={
 restaurant:{label:'رستوران',icon:'<path d="M7 3v8a2 2 0 002 2h0V3M5 3v6a2 2 0 002 2v10M17 3c-1.5 0-3 1.5-3 4v6h3v8"/>',data:{color:'#dc2626',font:'serif',radius:'round',hero:{title:'طعم اصیل ایرانی',text:'با ۲۰ سال تجربه، غذاهای خانگی با مواد اولیه‌ی تازه در محیطی گرم و دلنشین.',btn:'مشاهده منو',link:'#services'},about:{title:'درباره‌ی رستوران ما',text:'از سال ۱۳۸۰ با عشق، غذاهای اصیل ایرانی را برای شما آماده می‌کنیم. همه‌ی مواد اولیه از تأمین‌کنندگان معتبر تهیه می‌شوند.'},services:{title:'منوی ما',list:[NI('چلوکباب سلطانی'),NI('قورمه‌سبزی'),NI('جوجه‌کباب زعفرانی')]},contact:{title:'رزرو میز'},footer:{copy:'© رستوران ما · تمام حقوق محفوظ است.'}}},
 portfolio:{label:'پورتفولیو',icon:'<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>',data:{color:'#7c3aed',font:'system',radius:'sharp',hero:{title:'سلام، من یک طراح هستم.',text:'کارهای من را ببینید و اگر دوست داشتید، با من همکاری کنید.',btn:'مشاهده نمونه‌کارها',link:'#services'},about:{title:'درباره‌ی من',text:'۵ سال است در حوزه‌ی طراحی رابط کاربری و برند فعالیت می‌کنم.'},services:{title:'خدمات',cols:3,list:[NI('طراحی رابط کاربری'),NI('طراحی برند'),NI('طراحی موشن')]},gallery:{on:true,title:'نمونه‌کارها',cols:3,imgs:[]},footer:{copy:'© من · تمام حقوق محفوظ است.'}}},
 shop:{label:'فروشگاه',icon:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/>',data:{color:'#ea580c',font:'tahoma',radius:'soft',hero:{title:'خرید آنلاین با ارسال سریع',text:'جدیدترین محصولات با بهترین قیمت.',btn:'مشاهده محصولات',link:'#services'},about:{title:'درباره‌ی فروشگاه',text:'ارسال سریع به تمام نقاط کشور و ضمانت بازگشت وجه.'},services:{title:'محصولات',cols:3,list:[NI('محصول اول'),NI('محصول دوم'),NI('محصول سوم')]},contact:{title:'پشتیبانی'},footer:{copy:'© فروشگاه · تمام حقوق محفوظ است.'}}},
 clinic:{label:'کلینیک',icon:'<path d="M12 3v6M9 6h6"/><rect x="4" y="11" width="16" height="10" rx="2"/>',data:{color:'#0ea5e9',font:'tahoma',radius:'soft',hero:{title:'سلامتی شما، اولویت ماست.',text:'با کادری مجرب و تجهیزات مدرن در خدمت شما هستیم.',btn:'رزرو نوبت',link:'#contact'},about:{title:'درباره‌ی کلینیک',text:'ما با تیمی از پزشکان متخصص و پرستاران دلسوز، خدمات درمانی با کیفیت ارائه می‌دهیم.'},services:{title:'خدمات',cols:3,list:[NI('ویزیت عمومی'),NI('مشاوره تخصصی'),NI('آزمایشگاه')]},contact:{title:'رزرو نوبت'},footer:{copy:'© کلینیک · تمام حقوق محفوظ است.'}}},
 education:{label:'آموزشگاه',icon:'<path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11v4a4 4 0 008 0v-4"/>',data:{color:'#16a34a',font:'tahoma',radius:'soft',hero:{title:'آینده‌ات را بساز',text:'دوره‌های تخصصی با اساتید مجرب و مدرک معتبر.',btn:'مشاهده دوره‌ها',link:'#services'},about:{title:'درباره‌ی آموزشگاه',text:'بیش از ۱۰ سال است در حوزه‌ی آموزش فعالیت می‌کنیم.'},services:{title:'دوره‌های ما',cols:3,list:[NI('دوره‌ی مقدماتی'),NI('دوره‌ی پیشرفته'),NI('دوره‌ی تخصصی')]},contact:{title:'مشاوره رایگان'},footer:{copy:'© آموزشگاه · تمام حقوق محفوظ است.'}}},
 agency:{label:'آژانس',icon:'<circle cx="12" cy="12" r="9"/><path d="M16.2 7.8l-2.4 6-6 2.4 2.4-6z"/>',data:{color:'#111827',font:'system',radius:'soft',hero:{title:'برند شما، متمایز و به‌یادماندنی.',text:'استراتژی، طراحی و اجرای کمپین‌های تبلیغاتی.',btn:'گفتگو با ما',link:'#contact'},about:{title:'درباره‌ی آژانس',text:'ما با تیمی از متخصصان خلاق، برندها را به جایگاه شایسته‌شان می‌رسانیم.'},services:{title:'خدمات ما',cols:3,list:[NI('استراتژی برند'),NI('طراحی هویت'),NI('کمپین تبلیغاتی')]},contact:{title:'شروع همکاری'},footer:{copy:'© آژانس · تمام حقوق محفوظ است.'}}}
};

const get=p=>p.split('.').reduce((o,k)=>o[k],C),set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],C)[l]=v};
const T=(p,l,m)=>`<label>${l}${m?`<textarea data-k="${p}">${esc(get(p))}</textarea>`:`<input data-k="${p}" value="${esc(get(p))}">`}</label>`;
const ch=(p,o)=>`<div class="row">${o.map(([v,l])=>`<button class="ch ${String(get(p))===String(v)?'on':''}" data-k="${p}" data-v="${v}">${l}</button>`).join('')}</div>`;
const yn=(p,q)=>`<h3>${q}</h3>`+ch(p,[[true,'بله'],[false,'نه']]);
const heroImg=()=>`<h3>عکس</h3>${C.hero.img?`<div class="ord"><img class="th" src="${C.hero.img}" alt=""><button data-rm="h">حذف عکس</button></div>`:''}<label>${C.hero.img?'تغییر عکس':'انتخاب عکس از دستگاه'}<input type="file" accept="image/*" data-up="h"></label><p class="hint">اگر عکسی انتخاب نکنید، در حالت «متن و تصویر» یک طرح رنگی نمایش داده می‌شود.</p>`;
const sUI=(s,i)=>{const k='sliders.'+i;return`<div class="box"><div class="ord"><b>اسلایدر ${i+1}</b><button data-sx="${i}">✕</button></div>${T(k+'.title','عنوان (اختیاری)')}<h3>محل قرارگیری</h3>${ch(k+'.place',[['full','بین بخش‌ها'],['side','کنار بدنه']])}${s.place==='side'?`<h3>کدام طرف؟</h3>${ch(k+'.side',[['left','چپ'],['right','راست']])}`:`<h3>بعد از کدام بخش؟</h3>${ch(k+'.after',Object.entries(L))}`}<h3>حرکت خودکار</h3>${ch(k+'.mv',[[true,'بله'],[false,'نه']])}${s.mv?`${ch(k+'.dir',[['rtl','از راست به چپ'],['ltr','از چپ به راست']])}<h3>سرعت</h3>${ch(k+'.spd',[[7,'آهسته'],[4,'متوسط'],[2.5,'سریع']])}`:''}<h3>آیتم‌ها</h3><label>افزودن چند عکس با هم (هر عکس یک آیتم می‌شود)<input type="file" accept="image/*" multiple data-up="m${i}"></label>${s.items.map((it,j)=>`<div class="ord"><img class="th" style="background:var(--ln)" src="${it.img||'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='}" alt=""><input data-k="${k}.items.${j}.t" value="${esc(it.t)}" placeholder="عنوان"><button data-tx="${i},${j}">✕</button></div><div class="ord"><input data-k="${k}.items.${j}.link" value="${esc(it.link)}" placeholder="لینک (اختیاری)"><input type="file" accept="image/*" aria-label="عکس آیتم" data-up="s${i}_${j}"></div>`).join('')}<p><button data-ti="${i}">+ افزودن آیتم</button></p></div>`};
const adUI=(a,i)=>{const k='ads.list.'+i;return`<div class="box"><div class="ord"><b>تبلیغ ${i+1}</b><button data-ar="${i}">✕</button></div><h3>محل نمایش</h3>${ch(k+'.mode',[['inline','داخل صفحه'],['corner','گوشه صفحه (قابل بستن)'],['popup','وسط صفحه (پاپ‌آپ)']])}${a.mode==='corner'?`<h3>کدام گوشه؟</h3>${ch(k+'.side',[['left','چپ'],['right','راست']])}`:''}${a.mode!=='inline'?T(k+'.delay','نمایش بعد از چند ثانیه؟'):''}${a.img?`<img class="th" style="width:100%;height:auto;max-height:120px" src="${a.img}" alt="">`:''}<label>${a.img?'تغییر عکس بنر':'انتخاب عکس بنر'}<input type="file" accept="image/*" data-up="a${i}"></label>${T(k+'.t','عنوان تبلیغ (اختیاری)')}${T(k+'.d','متن تبلیغ (اختیاری)',1)}${T(k+'.bt','متن دکمه (اگر دکمه می‌خواهید)')}${T(k+'.link','لینک (با کلیک روی عکس یا دکمه باز می‌شود)')}</div>`};
const itemUI=(m,i)=>{const k='services.list.'+i;return`<div class="box"><div class="ord"><b>مورد ${i+1}</b><span><button data-im="${i},-1">▲</button> <button data-im="${i},1">▼</button> <button data-ir="${i}">✕</button></span></div>${T(k+'.t','عنوان')}${T(k+'.p','قیمت (اختیاری)')}${T(k+'.d','توضیح',1)}<h3>جای عکس</h3>${ch(k+'.pos',[['top','بالا'],['side','کنار'],['bottom','پایین']])}${m.imgs.map((d,j)=>`<div class="ord"><img class="th" src="${d}" alt=""><button data-ix="${i},${j}">حذف عکس</button></div>`).join('')}<label>افزودن عکس (می‌توانید چند عکس انتخاب کنید)<input type="file" accept="image/*" multiple data-up="i${i}"></label><h3>دکمه می‌خواهید؟</h3>${ch(k+'.bon',[[true,'بله'],[false,'نه']])}${m.bon?T(k+'.bt','متن دکمه')+T(k+'.bl','لینک دکمه (مثلاً https://...)'):''}</div>`};
